# The banner page build for agents' repos (made from elkuku/ingress-banners-template).
# Their workflow calls it:  uses: elkuku/ingress-banners/.github/workflows/build-page.yml@v1
name: Build banner page
on:
  workflow_call:
    inputs:
      tool-ref:
        description: Version of the ingress-banners tool (a tag or branch)
        type: string
        default: v1
jobs:
  page:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # keep the stitched screenshot, empty the inbox
      pages: write
      id-token: write
    concurrency:
      group: banner-page
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # A new repo runs this once before the app has uploaded anything (and maybe before Pages is on)
      - name: Look for screenshots
        id: input
        run: |
          if [ -f capture/medals.jpg ] || [ -n "$(find inbox -type f ! -name .gitkeep 2>/dev/null | head -1)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No screenshots yet (the app puts them in inbox/): nothing to build."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.input.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          repository: elkuku/ingress-banners
          ref: ${{ inputs.tool-ref }}
          path: .ingress-banners
      - if: steps.input.outputs.found == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: steps.input.outputs.found == 'true'
        run: pip install --quiet ./.ingress-banners
      - id: pages
        if: steps.input.outputs.found == 'true'
        uses: actions/configure-pages@v6
      - if: steps.input.outputs.found == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bannergress
          key: bannergress-${{ hashFiles('done.json', 'capture/**') }}
          restore-keys: bannergress-
      - name: Build the page
        id: build
        if: steps.input.outputs.found == 'true'
        run: ingress-banners site --repo . -o "${{ runner.temp }}/site" --url "${{ steps.pages.outputs.base_url }}" --cache "${{ runner.temp }}/bannergress"
      - name: Keep the stitched screenshot and empty the inbox
        if: steps.build.outputs.built == 'true'
        run: |
          git add -A capture inbox
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m 'Stitch the new screenshots'
            # A re-run of an older commit: main may have moved on (e.g. the first run kept the capture already)
            git push -q || { git pull -q --rebase && git push -q; } \
              || echo "::warning::Could not keep the stitched screenshot; the page is deployed anyway."
          fi
      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deploy
        if: steps.build.outputs.built == 'true'
        uses: actions/deploy-pages@v5
