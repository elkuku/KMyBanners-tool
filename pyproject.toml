[project]
name = "kmybanners-tool"
version = "0.1.0"
description = "Build a mission banner page from Ingress mission medal screenshots and Bannergress"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26"]

[project.scripts]
kmybanners-tool = "ingress_banners.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
ingress_banners = ["site/*", "site/*/*", "site/*/*/*"]
